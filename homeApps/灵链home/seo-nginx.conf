# ============================================================
# llapi.org SEO 落地页 Nginx 配置
# 适用环境：宝塔面板 / Nginx
# 部署位置：
#   宝塔面板 → 网站 → llapi.org → 配置文件（server { ... } 内）
#   —— 或 ——
#   /www/server/panel/vhost/nginx/llapi.org.conf
# ============================================================
# 策略说明：
#   落地页的 canonical、站内链接、sitemap 均统一使用「带 .html」
#   的 URL（llapi.org/claude-code.html），保证只有一个标准地址。
#   下面的规则只把「不带后缀」的访问 301 到带 .html 的地址，
#   避免出现两套 URL 造成的重复内容。
# ============================================================

# ------------------------------------------------------------
# 1) 无后缀 URL → 301 到 .html（地址栏会跳转为标准地址）
# ------------------------------------------------------------
location = /claude-code {
    return 301 https://$host/claude-code.html;
}
location = /codex-setup {
    return 301 https://$host/codex-setup.html;
}
location = /openai-compatible {
    return 301 https://$host/openai-compatible.html;
}
location = /api-proxy {
    return 301 https://$host/api-proxy.html;
}

# ------------------------------------------------------------
# 2) robots.txt 与 sitemap.xml 直接由静态文件提供
#    请确认这两个文件已上传到网站根目录。
# ------------------------------------------------------------
location = /robots.txt {
    try_files /robots.txt =404;
}
location = /sitemap.xml {
    try_files /sitemap.xml =404;
}

# ------------------------------------------------------------
# 3) HTML 页面不缓存（保持更新及时）
#    静态资源（css/js/svg/图片）长缓存
# ------------------------------------------------------------
location ~* \.(html?)$ {
    add_header Cache-Control "no-cache";
}

location ~* \.(css|js|svg|png|jpg|jpeg|webp|gif|ico|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
}

# ------------------------------------------------------------
# 4) Gzip 压缩
# ------------------------------------------------------------
gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    application/xml
    application/json
    application/javascript
    application/x-javascript
    image/svg+xml;

# ------------------------------------------------------------
# 5) 部署提示
#    · 若站点请求被全部反代到后端（如 sub2api 面板），
#      请把 1) 的 location 放在后端反代 location / 之前。
#    · 若你的站点已能直接 serve 根目录静态文件，无需额外改动。
# ============================================================
